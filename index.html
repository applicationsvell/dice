<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#121a33">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="紅白ダイス">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>紅白ダイス</title>
<style>
/* Layout: one full-bleed indigo felt tray under a lamp; the two dice are the only things on screen */
:root{
  --felt:#26345f;
  --felt-edge:#121a33;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--felt-edge);overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;touch-action:none}
#tray{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none;background:var(--felt)}
</style>
</head>
<body>
<canvas id="tray" role="img" tabindex="0" aria-label="画面をタップしてサイコロを振る"></canvas>
<script>
(function () {
'use strict';

/* ---------- small math helpers ---------- */
const TAU = Math.PI * 2;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const scl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const norm = a => { const l = Math.hypot(a[0], a[1], a[2]) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

function perspective(fovy, aspect, near, far) {
  const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
  return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
}
function ortho(l, r, b, t, n, f) {
  return new Float32Array([2 / (r - l), 0, 0, 0, 0, 2 / (t - b), 0, 0, 0, 0, -2 / (f - n), 0, -(r + l) / (r - l), -(t + b) / (t - b), -(f + n) / (f - n), 1]);
}
function lookAt(eye, target, up) {
  const z = norm(sub(eye, target)), x = norm(cross(up, z)), y = cross(z, x);
  return new Float32Array([x[0], y[0], z[0], 0, x[1], y[1], z[1], 0, x[2], y[2], z[2], 0, -dot(x, eye), -dot(y, eye), -dot(z, eye), 1]);
}
function mul4(a, b) {
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
    let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
    o[c * 4 + r] = s;
  }
  return o;
}

/* quaternions as [x, y, z, w] */
const Q = {
  id: () => [0, 0, 0, 1],
  axis(ax, ang) { const s = Math.sin(ang / 2); return [ax[0] * s, ax[1] * s, ax[2] * s, Math.cos(ang / 2)]; },
  mul(a, b) {
    return [
      a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
      a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
      a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
      a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]
    ];
  },
  inv: q => [-q[0], -q[1], -q[2], q[3]],
  norm(q) { const l = Math.hypot(q[0], q[1], q[2], q[3]) || 1; return [q[0] / l, q[1] / l, q[2] / l, q[3] / l]; },
  slerp(a, b, t) {
    let c = a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3];
    if (c < 0) { b = [-b[0], -b[1], -b[2], -b[3]]; c = -c; }
    if (c > 0.9995) return Q.norm([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t]);
    const th = Math.acos(c), s = Math.sin(th), wa = Math.sin((1 - t) * th) / s, wb = Math.sin(t * th) / s;
    return [a[0] * wa + b[0] * wb, a[1] * wa + b[1] * wb, a[2] * wa + b[2] * wb, a[3] * wa + b[3] * wb];
  },
  fromUnit(u, v) {
    const d = dot(u, v);
    if (d < -0.999999) {
      let ax = cross([1, 0, 0], u);
      if (Math.hypot(ax[0], ax[1], ax[2]) < 1e-6) ax = cross([0, 0, 1], u);
      return Q.axis(norm(ax), Math.PI);
    }
    const c = cross(u, v);
    return Q.norm([c[0], c[1], c[2], 1 + d]);
  },
  mat3(q) {
    const [x, y, z, w] = q;
    return new Float32Array([
      1 - 2 * (y * y + z * z), 2 * (x * y + z * w), 2 * (x * z - y * w),
      2 * (x * y - z * w), 1 - 2 * (x * x + z * z), 2 * (y * z + x * w),
      2 * (x * z + y * w), 2 * (y * z - x * w), 1 - 2 * (x * x + y * y)
    ]);
  }
};

/* ---------- the die: a rounded cube, 1 unit wide ---------- */
const ROUND = 0.13, INNER = 0.5 - ROUND;
// Face layout of a standard die: 1-6, 2-5, 3-4 opposite.
const FACES = [
  { n: [0, 1, 0], t: [1, 0, 0], b: [0, 0, -1], v: 1 },
  { n: [0, -1, 0], t: [1, 0, 0], b: [0, 0, 1], v: 6 },
  { n: [0, 0, 1], t: [1, 0, 0], b: [0, 1, 0], v: 2 },
  { n: [0, 0, -1], t: [-1, 0, 0], b: [0, 1, 0], v: 5 },
  { n: [1, 0, 0], t: [0, 0, -1], b: [0, 1, 0], v: 3 },
  { n: [-1, 0, 0], t: [0, 0, 1], b: [0, 1, 0], v: 4 }
];
const FACE_NORMAL = {};
FACES.forEach(f => { FACE_NORMAL[f.v] = f.n; });

function buildDieMesh() {
  const E = 5, M = 4, S = E * 2 + M;
  const coord = i => i <= E ? -0.5 + (i / E) * ROUND
    : i >= S - E ? 0.5 - ((S - i) / E) * ROUND
    : -INNER + ((i - E) / M) * 2 * INNER;
  const verts = [], idx = [];
  FACES.forEach(f => {
    const base = verts.length / 12;
    for (let j = 0; j <= S; j++) for (let i = 0; i <= S; i++) {
      const a = coord(i), b = coord(j);
      const p = [f.n[0] * 0.5 + f.t[0] * a + f.b[0] * b, f.n[1] * 0.5 + f.t[1] * a + f.b[1] * b, f.n[2] * 0.5 + f.t[2] * a + f.b[2] * b];
      const c = [clamp(p[0], -INNER, INNER), clamp(p[1], -INNER, INNER), clamp(p[2], -INNER, INNER)];
      const d = norm(sub(p, c));
      verts.push(c[0] + d[0] * ROUND, c[1] + d[1] * ROUND, c[2] + d[2] * ROUND, d[0], d[1], d[2], a + 0.5, b + 0.5, f.v, f.t[0], f.t[1], f.t[2]);
    }
    for (let j = 0; j < S; j++) for (let i = 0; i < S; i++) {
      const k = base + j * (S + 1) + i;
      idx.push(k, k + 1, k + S + 2, k, k + S + 2, k + S + 1);
    }
  });
  return { verts: new Float32Array(verts), idx: new Uint16Array(idx) };
}

/* ---------- shaders ---------- */
const DEPTH_VS = `#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uLightVP; uniform mat4 uModel;
void main(){ gl_Position = uLightVP * uModel * vec4(aPos,1.0); }`;
const DEPTH_FS = `#version 300 es
precision mediump float;
void main(){}`;

const DIE_VS = `#version 300 es
layout(location=0) in vec3 aPos;
layout(location=1) in vec3 aNrm;
layout(location=2) in vec2 aUv;
layout(location=3) in float aVal;
layout(location=4) in vec3 aTan;
uniform mat4 uVP; uniform mat4 uModel; uniform mat3 uRot;
out vec3 vW; out vec3 vN; out vec2 vUv; flat out float vVal; out vec3 vT;
void main(){
  vec4 w = uModel * vec4(aPos,1.0);
  vW = w.xyz; vN = uRot * aNrm; vT = uRot * aTan; vUv = aUv; vVal = aVal;
  gl_Position = uVP * w;
}`;
const DIE_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec3 vN; in vec2 vUv; flat in float vVal; in vec3 vT;
uniform vec3 uCam; uniform vec3 uL; uniform vec3 uLightCol; uniform vec3 uSky; uniform vec3 uGround;
uniform vec3 uBase; uniform vec3 uPip; uniform vec3 uOne; uniform float uOneR; uniform float uExposure;
out vec4 outColor;
const float LO = 0.275, HI = 0.725, PR = 0.082;
vec2 pipPos(int n, int k){
  if (n == 1) return vec2(0.5);
  if (n == 2) return k == 0 ? vec2(LO, HI) : vec2(HI, LO);
  if (n == 3) return k == 0 ? vec2(LO, HI) : (k == 1 ? vec2(0.5) : vec2(HI, LO));
  if (n == 4 || n == 5) {
    if (k == 4) return vec2(0.5);
    return vec2((k % 2) == 0 ? LO : HI, (k / 2) == 0 ? LO : HI);
  }
  int b = k % 3;
  return vec2((k / 3) == 0 ? LO : HI, b == 0 ? LO : (b == 1 ? 0.5 : HI));
}
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  vec3 N = normalize(vN);
  vec3 T = normalize(vT - N * dot(vT, N));
  vec3 B = cross(N, T);
  int n = int(vVal + 0.5);
  float best = 10.0; vec2 bc = vec2(0.5);
  for (int k = 0; k < 6; k++) {
    if (k >= n) break;
    vec2 c = pipPos(n, k);
    float d = distance(vUv, c);
    if (d < best) { best = d; bc = c; }
  }
  float R = (n == 1) ? uOneR : PR;
  float fw = fwidth(best) * 1.1 + 1e-4;
  float m = 1.0 - smoothstep(R - fw, R + fw, best);
  vec2 off = (vUv - bc) / R;
  float rr = clamp(length(off), 0.0, 1.0);
  // a pip is a shallow spherical dimple: its normal leans toward the centre
  vec3 Np = normalize(N - (T * off.x + B * off.y) * 0.9);
  N = normalize(mix(N, Np, m));
  vec3 pipCol = (n == 1) ? uOne : uPip;
  vec3 alb = mix(uBase, pipCol * (0.7 + 0.3 * (1.0 - rr * rr)), m);
  float rough = mix(0.28, 0.5, m);

  vec3 V = normalize(uCam - vW), L = normalize(uL), H = normalize(V + L);
  float ndl = max(dot(N, L), 0.0), ndv = max(dot(N, V), 1e-3), ndh = max(dot(N, H), 0.0);
  float a = rough * rough, a2 = a * a;
  float dd = ndh * ndh * (a2 - 1.0) + 1.0;
  float D = a2 / (3.14159 * dd * dd);
  float kk = a * 0.5;
  float G = (ndl / (ndl * (1.0 - kk) + kk)) * (ndv / (ndv * (1.0 - kk) + kk));
  float F = 0.04 + 0.96 * pow(1.0 - max(dot(H, V), 0.0), 5.0);
  vec3 spec = vec3(D * G * F / (4.0 * ndl * ndv + 1e-4)) * ndl;
  vec3 diff = alb * ndl * (1.0 - F);
  vec3 amb = alb * mix(uGround, uSky, N.y * 0.5 + 0.5);
  vec3 Rv = reflect(-V, N);
  float Fe = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
  vec3 env = mix(uGround * 0.8, uSky * 1.6, smoothstep(-0.25, 0.7, Rv.y))
           + vec3(1.0, 0.96, 0.9) * pow(max(dot(Rv, L), 0.0), 30.0) * 3.0;
  vec3 col = (diff + spec) * uLightCol + amb + env * Fe * (1.0 - 0.7 * m);
  // the felt darkens the skirt of the die where it meets the table
  col *= mix(0.5, 1.0, smoothstep(0.0, 0.32, vW.y));
  col = aces(col * uExposure);
  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

const FLOOR_VS = `#version 300 es
layout(location=0) in vec3 aPos;
uniform mat4 uVP; uniform mat4 uLightVP;
out vec3 vW; out vec4 vLS;
void main(){ vW = aPos; vLS = uLightVP * vec4(aPos,1.0); gl_Position = uVP * vec4(aPos,1.0); }`;
const FLOOR_FS = `#version 300 es
precision highp float;
in vec3 vW; in vec4 vLS;
uniform sampler2D uFelt; uniform highp sampler2DShadow uShadow; uniform float uHasShadow;
uniform vec3 uL; uniform vec3 uLightCol; uniform vec3 uSky; uniform vec3 uFeltCol;
uniform vec4 uDice[2]; uniform vec2 uRes; uniform float uTexel; uniform float uExposure;
out vec4 outColor;
const vec2 PD[12] = vec2[12](
  vec2(-0.326,-0.406), vec2(-0.840,-0.074), vec2(-0.696, 0.457), vec2(-0.203, 0.621),
  vec2( 0.962,-0.195), vec2( 0.473,-0.480), vec2( 0.519, 0.767), vec2( 0.185,-0.893),
  vec2( 0.507, 0.064), vec2( 0.896, 0.412), vec2(-0.322,-0.933), vec2(-0.792,-0.598));
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14), 0.0, 1.0); }
void main(){
  float tex = texture(uFelt, vW.xz * 0.32).r;
  vec3 alb = uFeltCol * (0.72 + 0.56 * tex);
  float sh = 1.0;
  if (uHasShadow > 0.5) {
    vec3 sc = vLS.xyz / vLS.w * 0.5 + 0.5;
    if (sc.x > 0.0 && sc.x < 1.0 && sc.y > 0.0 && sc.y < 1.0) {
      float s = 0.0;
      for (int i = 0; i < 12; i++) s += texture(uShadow, vec3(sc.xy + PD[i] * uTexel * 2.6, sc.z - 0.002));
      sh = mix(0.25, 1.0, s / 12.0);
    }
  }
  float ao = 1.0;
  for (int i = 0; i < 2; i++) {
    vec2 d = vW.xz - uDice[i].xz;
    float h = uDice[i].w;
    float r = 0.5 + h * 0.55;
    ao *= 1.0 - 0.62 * exp(-dot(d, d) / (r * r)) / (1.0 + h * 1.8);
  }
  float pool = 1.0 - 0.55 * smoothstep(0.8, 8.0, length(vW.xz - vec2(-0.4, -0.6)));
  float ndl = max(normalize(uL).y, 0.0);
  vec3 col = alb * (uLightCol * ndl * sh * pool * mix(0.65, 1.0, ao) + uSky * 0.55 * ao);
  vec2 sv = (gl_FragCoord.xy / uRes - 0.5) * vec2(uRes.x / uRes.y, 1.0);
  col *= 1.0 - 0.7 * smoothstep(0.18, 0.78, length(sv));
  col = aces(col * uExposure);
  outColor = vec4(pow(col, vec3(1.0 / 2.2)), 1.0);
}`;

/* ---------- colours ---------- */
const lin = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255].map(c => Math.pow(c / 255, 2.2)); };
const LOOK = {
  felt: lin('#212c58'),
  sky: [0.16, 0.19, 0.30],
  ground: [0.03, 0.04, 0.09],
  light: [2.35, 2.22, 2.02],
  exposure: 1.0,
  clear: [0x12 / 255, 0x1a / 255, 0x33 / 255]
};
const LIGHT_DIR = norm([-0.52, 1.0, -0.40]);

/* ---------- WebGL setup ---------- */
const canvas = document.getElementById('tray');
let gl = null, progs = {}, dieGeo = null, floorGeo = null, feltTex = null, shadowTex = null, shadowFB = null, hasShadow = false;
const SM = 1024, SHADOW_HALF = 8;
const lightVP = mul4(ortho(-SHADOW_HALF, SHADOW_HALF, -SHADOW_HALF, SHADOW_HALF, 1, 50), lookAt(scl(LIGHT_DIR, 25), [0, 0, 0], [0, 0, -1]));

function compile(vs, fs) {
  const mk = (type, src) => {
    const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  };
  const p = gl.createProgram();
  gl.attachShader(p, mk(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mk(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u = {};
  const count = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(p, i);
    const name = info.name.replace(/\[0\]$/, '');
    u[name] = gl.getUniformLocation(p, info.name);
  }
  return { p, u };
}

function makeFeltTexture() {
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const x = cv.getContext('2d');
  const img = x.createImageData(S, S);
  for (let i = 0; i < S * S; i++) {
    const v = 128 + (Math.random() - 0.5) * 70;
    img.data[i * 4] = img.data[i * 4 + 1] = img.data[i * 4 + 2] = v; img.data[i * 4 + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  x.lineCap = 'round';
  for (let i = 0; i < 1400; i++) {
    const px = Math.random() * S, py = Math.random() * S, a = Math.random() * TAU, l = 2 + Math.random() * 7;
    const light = Math.random() < 0.5;
    x.strokeStyle = light ? 'rgba(255,255,255,0.10)' : 'rgba(0,0,0,0.12)';
    x.lineWidth = 0.6 + Math.random() * 0.6;
    for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
      x.beginPath(); x.moveTo(px + ox, py + oy); x.lineTo(px + ox + Math.cos(a) * l, py + oy + Math.sin(a) * l); x.stroke();
    }
  }
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, cv);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  const an = gl.getExtension('EXT_texture_filter_anisotropic');
  if (an) gl.texParameterf(gl.TEXTURE_2D, an.TEXTURE_MAX_ANISOTROPY_EXT, Math.min(8, gl.getParameter(an.MAX_TEXTURE_MAX_ANISOTROPY_EXT)));
  return t;
}

function initGL() {
  gl = canvas.getContext('webgl2', { antialias: true, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return false;
  progs.depth = compile(DEPTH_VS, DEPTH_FS);
  progs.die = compile(DIE_VS, DIE_FS);
  progs.floor = compile(FLOOR_VS, FLOOR_FS);

  const mesh = buildDieMesh();
  const vao = gl.createVertexArray(); gl.bindVertexArray(vao);
  const vb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.bufferData(gl.ARRAY_BUFFER, mesh.verts, gl.STATIC_DRAW);
  const ib = gl.createBuffer(); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, mesh.idx, gl.STATIC_DRAW);
  const st = 12 * 4;
  [[0, 3, 0], [1, 3, 3], [2, 2, 6], [3, 1, 8], [4, 3, 9]].forEach(([loc, size, off]) => {
    gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, size, gl.FLOAT, false, st, off * 4);
  });
  gl.bindVertexArray(null);
  dieGeo = { vao, count: mesh.idx.length };

  const fvao = gl.createVertexArray(); gl.bindVertexArray(fvao);
  const fb = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, fb);
  const F = 40;
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-F, 0, -F, -F, 0, F, F, 0, F, -F, 0, -F, F, 0, F, F, 0, -F]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 3, gl.FLOAT, false, 12, 0);
  gl.bindVertexArray(null);
  floorGeo = { vao: fvao, count: 6 };

  feltTex = makeFeltTexture();

  shadowTex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, shadowTex);
  gl.texStorage2D(gl.TEXTURE_2D, 1, gl.DEPTH_COMPONENT24, SM, SM);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_MODE, gl.COMPARE_REF_TO_TEXTURE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_COMPARE_FUNC, gl.LEQUAL);
  shadowFB = gl.createFramebuffer();
  gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
  gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.TEXTURE_2D, shadowTex, 0);
  gl.drawBuffers([gl.NONE]); gl.readBuffer(gl.NONE);
  hasShadow = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  return true;
}

/* ---------- camera ---------- */
const VIEW_DIR = norm([0, 1, 0.3]);
const FOV = 30 * Math.PI / 180;
let viewVP = null, camPos = [0, 20, 6], halfW = 3, halfH = 4, dpr = 1;

function resize() {
  if (!gl) return;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  const aspect = w / h, t = Math.tan(FOV / 2);
  const dist = Math.max(6.6 / (2 * t), 5.4 / (2 * t * aspect));
  camPos = scl(VIEW_DIR, dist);
  viewVP = mul4(perspective(FOV, aspect, 0.5, 120), lookAt(camPos, [0, 0, 0], [0, 1, 0]));
  halfH = dist * t; halfW = halfH * aspect;
  render();
}

/* ---------- dice state ---------- */
const DICE = [
  { name: 'white', base: lin('#f1f0ec'), pip: lin('#1d2027'), one: lin('#d0182b'), oneR: 0.15 },
  { name: 'red', base: lin('#c3141f'), pip: lin('#f6f2ea'), one: lin('#f6f2ea'), oneR: 0.112 }
];
const support = q => { const m = Q.mat3(q); return INNER * (Math.abs(m[1]) + Math.abs(m[4]) + Math.abs(m[7])) + ROUND; };
const restingQ = value => Q.mul(Q.axis([0, 1, 0], rand(0, TAU)), Q.fromUnit(FACE_NORMAL[value], [0, 1, 0]));

let pairAngle = rand(-0.35, 0.35);
(function placeInitial() {
  const d = [Math.cos(pairAngle) * 1.05, Math.sin(pairAngle) * 1.05];
  DICE[0].value = 1 + Math.floor(Math.random() * 6);
  DICE[1].value = 1 + Math.floor(Math.random() * 6);
  DICE[0].pos = [-d[0], 0.5, -d[1] + 0.2];
  DICE[1].pos = [d[0], 0.5, d[1] + 0.2];
  DICE.forEach(die => { die.q = restingQ(die.value); die.h = 0; die.plan = null; });
})();

/* ---------- drawing ---------- */
function drawDie(prog, die, modelLoc, rotLoc) {
  const m = Q.mat3(die.q);
  const p = die.pos;
  gl.uniformMatrix4fv(modelLoc, false, new Float32Array([m[0], m[1], m[2], 0, m[3], m[4], m[5], 0, m[6], m[7], m[8], 0, p[0], p[1], p[2], 1]));
  if (rotLoc) gl.uniformMatrix3fv(rotLoc, false, m);
  gl.drawElements(gl.TRIANGLES, dieGeo.count, gl.UNSIGNED_SHORT, 0);
}

function render() {
  if (!gl || !viewVP || gl.isContextLost()) return;
  gl.enable(gl.DEPTH_TEST);
  gl.enable(gl.CULL_FACE);

  if (hasShadow) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, shadowFB);
    gl.viewport(0, 0, SM, SM);
    gl.clear(gl.DEPTH_BUFFER_BIT);
    gl.enable(gl.POLYGON_OFFSET_FILL); gl.polygonOffset(2, 4);
    const P = progs.depth; gl.useProgram(P.p);
    gl.uniformMatrix4fv(P.u.uLightVP, false, lightVP);
    gl.bindVertexArray(dieGeo.vao);
    DICE.forEach(d => drawDie(P, d, P.u.uModel, null));
    gl.disable(gl.POLYGON_OFFSET_FILL);
  }

  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, canvas.width, canvas.height);
  gl.clearColor(LOOK.clear[0], LOOK.clear[1], LOOK.clear[2], 1);
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  gl.disable(gl.CULL_FACE);
  const F = progs.floor; gl.useProgram(F.p);
  gl.uniformMatrix4fv(F.u.uVP, false, viewVP);
  gl.uniformMatrix4fv(F.u.uLightVP, false, lightVP);
  gl.uniform3fv(F.u.uL, LIGHT_DIR);
  gl.uniform3fv(F.u.uLightCol, LOOK.light);
  gl.uniform3fv(F.u.uSky, LOOK.sky);
  gl.uniform3fv(F.u.uFeltCol, LOOK.felt);
  gl.uniform1f(F.u.uExposure, LOOK.exposure);
  gl.uniform1f(F.u.uHasShadow, hasShadow ? 1 : 0);
  gl.uniform1f(F.u.uTexel, 1 / SM);
  gl.uniform2f(F.u.uRes, canvas.width, canvas.height);
  gl.uniform4fv(F.u.uDice, new Float32Array([DICE[0].pos[0], 0, DICE[0].pos[2], DICE[0].h, DICE[1].pos[0], 0, DICE[1].pos[2], DICE[1].h]));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, feltTex); gl.uniform1i(F.u.uFelt, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, shadowTex); gl.uniform1i(F.u.uShadow, 1);
  gl.bindVertexArray(floorGeo.vao);
  gl.drawArrays(gl.TRIANGLES, 0, floorGeo.count);

  gl.enable(gl.CULL_FACE);
  const D = progs.die; gl.useProgram(D.p);
  gl.uniformMatrix4fv(D.u.uVP, false, viewVP);
  gl.uniform3fv(D.u.uCam, camPos);
  gl.uniform3fv(D.u.uL, LIGHT_DIR);
  gl.uniform3fv(D.u.uLightCol, LOOK.light);
  gl.uniform3fv(D.u.uSky, LOOK.sky);
  gl.uniform3fv(D.u.uGround, LOOK.ground);
  gl.uniform1f(D.u.uExposure, LOOK.exposure);
  gl.bindVertexArray(dieGeo.vao);
  DICE.forEach(d => {
    gl.uniform3fv(D.u.uBase, d.base); gl.uniform3fv(D.u.uPip, d.pip); gl.uniform3fv(D.u.uOne, d.one);
    gl.uniform1f(D.u.uOneR, d.oneR);
    drawDie(D, d, D.u.uModel, D.u.uRot);
  });
  gl.bindVertexArray(null);
}

/* ---------- sound: dice landing on felt ---------- */
let ac = null, master = null, noiseBuf = null;
function ensureAudio() {
  try {
    if (!ac) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ac = new AC();
      const comp = ac.createDynamicsCompressor();
      comp.threshold.value = -16; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
      master = ac.createGain(); master.gain.value = 0.9;
      master.connect(comp); comp.connect(ac.destination);
      noiseBuf = ac.createBuffer(1, Math.floor(ac.sampleRate * 0.4), ac.sampleRate);
      const ch = noiseBuf.getChannelData(0);
      for (let i = 0; i < ch.length; i++) ch[i] = Math.random() * 2 - 1;
    }
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { ac = null; }
}
function env(g, t, peak, decay) {
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t + 0.003);
  g.gain.exponentialRampToValueAtTime(0.0001, t + decay);
}
function clack(s, pan) {
  if (!ac || ac.state !== 'running') return;
  try {
    const t = ac.currentTime + 0.004;
    let out = master;
    if (ac.createStereoPanner) { out = ac.createStereoPanner(); out.pan.value = clamp(pan, -0.7, 0.7); out.connect(master); }
    const n1 = ac.createBufferSource(); n1.buffer = noiseBuf; n1.playbackRate.value = rand(0.8, 1.2);
    const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420 + 1500 * s; lp.Q.value = 0.9;
    const g1 = ac.createGain(); env(g1, t, 0.85 * s + 0.03, 0.06 + 0.09 * s);
    n1.connect(lp); lp.connect(g1); g1.connect(out); n1.start(t, rand(0, 0.15), 0.2);

    const o = ac.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(rand(210, 290), t); o.frequency.exponentialRampToValueAtTime(110, t + 0.08);
    const g2 = ac.createGain(); env(g2, t, 0.32 * s + 0.01, 0.1);
    o.connect(g2); g2.connect(out); o.start(t); o.stop(t + 0.13);

    const n2 = ac.createBufferSource(); n2.buffer = noiseBuf;
    const bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = rand(2800, 4200); bp.Q.value = 3.5;
    const g3 = ac.createGain(); env(g3, t, 0.22 * s + 0.015, 0.03);
    n2.connect(bp); bp.connect(g3); g3.connect(out); n2.start(t, rand(0, 0.2), 0.05);
  } catch (e) { /* sound is optional */ }
}

/* ---------- screen stays on while the tray is open ---------- */
let wakeLock = null;
async function requestWake() {
  try {
    if (wakeLock || !('wakeLock' in navigator) || document.visibilityState !== 'visible') return;
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
  } catch (e) { wakeLock = null; }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { requestWake(); render(); }
  else if (ac && ac.state === 'running') { try { ac.suspend(); } catch (e) {} }
});

/* ---------- the throw ---------- */
// Every pair where one die beats the other, equally likely.
function pickPair(winner) {
  const hi = [], lo = [];
  for (let a = 2; a <= 6; a++) for (let b = 1; b < a; b++) { hi.push(a); lo.push(b); }
  const k = Math.floor(Math.random() * hi.length);
  return winner === 'white' ? { white: hi[k], red: lo[k] } : { white: lo[k], red: hi[k] };
}

const reduceMotion = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } })();

function planDie(die, value, end, t0) {
  const start = [die.pos[0], die.pos[2]];
  const settle = reduceMotion ? 0 : 0.34;
  const T = reduceMotion ? 0.75 : rand(1.75, 2.1);
  const Tm = T - settle;
  const g = 30, e = 0.36;
  let v0 = reduceMotion ? 4 : rand(11, 13.5), y0 = 0, t = 0;
  const segs = [], hits = [];
  for (let k = 0; k < 6; k++) {
    const dt = (v0 + Math.sqrt(v0 * v0 + 2 * g * y0)) / g;
    segs.push([t, y0, v0, t + dt]);
    t += dt;
    const impact = g * dt - v0;
    hits.push([t, Math.min(1, impact / 13)]);
    v0 = impact * e; y0 = 0;
    if (v0 < 0.9 || t > Tm * 0.78) break;
  }
  const dx = end[0] - start[0], dz = end[1] - start[1], L = Math.hypot(dx, dz);
  const a = rand(0, TAU);
  const dir = L > 0.4 ? [dx / L, 0, dz / L] : [Math.cos(a), 0, Math.sin(a)];
  const ax1 = norm(cross(dir, [0, 1, 0]));
  const ax2 = norm([rand(-1, 1), rand(-1, 1), rand(-1, 1)]);
  const A1 = (reduceMotion ? 0.5 : rand(1.7, 2.6)) * TAU;
  const A2 = (reduceMotion ? 0.1 : rand(0.25, 0.7)) * TAU * (Math.random() < 0.5 ? -1 : 1);
  const qFinal = restingQ(value);
  const q0 = Q.mul(Q.mul(Q.axis(ax1, A1), Q.axis(ax2, A2)), qFinal);
  const corr = Q.norm(Q.mul(die.q, Q.inv(q0)));
  const ax3 = norm([ax1[0] + rand(-0.25, 0.25), 0, ax1[2] + rand(-0.25, 0.25)]);
  if (!reduceMotion) hits.push([Tm, 0.4], [Tm + Math.PI / 30, 0.16]);
  die.plan = { t0, T, Tm, start, end, segs, hits, hit: 0, ax1, ax2, A1, A2, qFinal, corr, ax3, rock: rand(0.08, 0.14), value };
}

function bounceY(segs, t) {
  for (let i = 0; i < segs.length; i++) {
    const s = segs[i];
    if (t < s[3]) { const dt = Math.max(0, t - s[0]); return Math.max(0, s[1] + s[2] * dt - 15 * dt * dt); }
  }
  return 0;
}

// returns true when the die has come to rest
function stepDie(die, t, now) {
  const p = die.plan;
  while (p.hit < p.hits.length && p.hits[p.hit][0] <= t) {
    const late = t - p.hits[p.hit][0];
    if (late < 0.12) {
      clack(p.hits[p.hit][1], die.pos[0] / Math.max(1, halfW));
      if (p.hit === 0 && navigator.vibrate) { try { navigator.vibrate(12); } catch (e) {} }
    }
    p.hit++;
  }
  if (t >= p.T) {
    die.q = p.qFinal; die.value = p.value;
    die.pos = [p.end[0], 0.5, p.end[1]]; die.h = 0;
    return true;
  }
  const u = Math.min(1, t / p.Tm);
  const m = 1 - Math.pow(1 - u, 3);
  const x = p.start[0] + (p.end[0] - p.start[0]) * m;
  const z = p.start[1] + (p.end[1] - p.start[1]) * m;
  let q;
  if (t < p.Tm) {
    const s = Math.pow(1 - u, 1.7);
    q = Q.mul(Q.mul(Q.axis(p.ax1, p.A1 * s), Q.axis(p.ax2, p.A2 * s)), p.qFinal);
    const w = 1 - smooth(0, 0.42, u);
    if (w > 0) q = Q.mul(Q.slerp(Q.id(), p.corr, w), q);
  } else {
    const tau = t - p.Tm;
    q = Q.mul(Q.axis(p.ax3, -p.rock * Math.exp(-11 * tau) * Math.sin(30 * tau)), p.qFinal);
  }
  const yb = bounceY(p.segs, t);
  die.q = q; die.h = yb;
  die.pos = [x, yb + support(q), z];
  return false;
}

let rolling = false, raf = 0;
function frame(now) {
  raf = 0;
  let resting = true;
  try {
    const t = now / 1000;
    DICE.forEach(d => {
      if (!d.plan) return;
      if (stepDie(d, t - d.plan.t0, t)) d.plan = null; else resting = false;
    });
    render();
  } catch (err) {
    console.error(err);
  }
  if (!resting) raf = requestAnimationFrame(frame);
  else finishRoll();
}

function finishRoll() {
  canvas.setAttribute('aria-label', '白 ' + DICE[0].value + '、赤 ' + DICE[1].value);
  setTimeout(() => { rolling = false; }, 220);
}

function roll(winner) {
  if (rolling || !gl) return;
  rolling = true;
  const vals = pickPair(winner);

  // where the pair comes to rest: side by side, a little apart, never off the tray
  const lo = Math.round(pairAngle / Math.PI) * Math.PI;
  const from = Math.max(pairAngle - 0.95, lo - 0.85), to = Math.min(pairAngle + 0.95, lo + 0.85);
  pairAngle = rand(from, to);
  const half = [Math.cos(pairAngle) * 1.05, Math.sin(pairAngle) * 1.05];
  const limX = halfW - 1.0, limZ = halfH - 1.1;
  let c = [0, 0];
  for (let i = 0; i < 24; i++) {
    const cand = [rand(-1.1, 1.1), rand(-1.9, 1.9)];
    if (Math.abs(cand[0]) + Math.abs(half[0]) <= limX && Math.abs(cand[1]) + Math.abs(half[1]) <= limZ) { c = cand; break; }
  }
  const t0 = performance.now() / 1000;
  planDie(DICE[0], vals.white, [c[0] - half[0], c[1] - half[1]], t0);
  planDie(DICE[1], vals.red, [c[0] + half[0], c[1] + half[1]], t0);
  if (!raf) raf = requestAnimationFrame(frame);
}

/* ---------- input: top half → red wins, bottom half → white wins ---------- */
canvas.addEventListener('pointerdown', e => {
  if (e.button > 0) return;
  e.preventDefault();
  ensureAudio(); requestWake();
  if (rolling) return;
  const r = canvas.getBoundingClientRect();
  roll(e.clientY - r.top >= r.height / 2 ? 'white' : 'red');
}, { passive: false });
canvas.addEventListener('keydown', e => {
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault(); ensureAudio();
    roll(e.key === 'ArrowDown' ? 'white' : 'red');
  }
});
canvas.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });

canvas.addEventListener('webglcontextlost', e => {
  e.preventDefault();
  if (raf) { cancelAnimationFrame(raf); raf = 0; }
  DICE.forEach(d => { if (d.plan) { d.q = d.plan.qFinal; d.value = d.plan.value; d.pos = [d.plan.end[0], 0.5, d.plan.end[1]]; d.h = 0; d.plan = null; } });
  rolling = false;
});
canvas.addEventListener('webglcontextrestored', () => { try { initGL(); resize(); } catch (err) { console.error(err); } });

/* ---------- start ---------- */
try {
  if (!initGL()) { canvas.setAttribute('aria-label', 'この端末ではサイコロを表示できません'); return; }
} catch (err) {
  console.error(err);
  return;
}
if (window.ResizeObserver) new ResizeObserver(() => resize()).observe(canvas);
else window.addEventListener('resize', resize);
resize();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
</script>
